{% extends "design_studio/layouts/base.html" %}
{% load i18n %}

{% block title %}{% trans "Passwort ändern" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-key me-1"></i> {% trans "Passwort ändern" %}</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'auth_kit:profile' %}" class="btn btn-outline-secondary rounded-pill px-4">{% trans "Zurück" %}</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold" style="background: var(--app-gradient); border: none;">
                            {% trans "Passwort speichern" %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
