[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-django-kit"
version = "1.0.0"
description = "Reusable Django authentication, password management, and full user profile UI matching django-design-studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
include = ["auth_kit*"]

[tool.setuptools.package-data]
auth_kit = [
    "templates/**/*",
]
